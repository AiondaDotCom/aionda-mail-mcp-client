name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Ubuntu ${{ matrix.ubuntu }} · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04', '26.04']
        node: [22, 24]
    steps:
      - name: Install base packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Show environment
        run: |
          . /etc/os-release && echo "OS: $PRETTY_NAME"
          node --version
          npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Unit tests with coverage thresholds (90 % lines)
        run: npm run test:coverage
      - name: Smoke test the CLI entry point
        run: |
          out=$(AIONDA_API_KEY= node bin/aionda-mail-mcp.js 2>&1 < /dev/null || true)
          echo "$out"
          echo "$out" | grep -q "AIONDA_API_KEY"
